<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Pricing Component</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* FIXED: Fluid width with responsive bounds */
    .pricing-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 343px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 24px;
    }
    .amount {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
    }
    .period {
      color: #94a3b8;
      font-size: 14px;
    }

    /* FIXED: Ellipsis truncation */
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .feature-name-clipped {
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* FIXED: 44x44px accessible touch target */
    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      color: #94a3b8;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border-radius: 8px;
    }

    .cta-btn {
      width: 100%;
      padding: 14px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pro Developer Tier</h1>
    <p>Everything you need for autonomous agent workflows</p>
  </div>

  <div class="pricing-card">
    <button class="close-btn" aria-label="Dismiss">×</button>
    <span class="badge">POPULAR</span>
    <div class="price-row">
      <span class="amount">$29</span>
      <span class="period">/ month</span>
    </div>

    <div class="feature-item">
      <span>✓</span>
      <span class="feature-name-clipped">Unlimited Autonomous Agents & Subagents</span>
    </div>
    <div class="feature-item">
      <span>✓</span>
      <span>Automated Headless Layout Auditing</span>
    </div>
    <div class="feature-item">
      <span>✓</span>
      <span>Priority Model Context Protocol Support</span>
    </div>

    <button class="cta-btn">Start 14-Day Free Trial</button>
  </div>
</body>
</html>
